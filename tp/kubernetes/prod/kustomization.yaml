apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gp-prod

resources:
  - namespace.yaml
  # secret.yaml is intentionally excluded — credentials are generated and applied
  # by scripts/gen-k8s-secrets.sh to avoid committing passwords.
  - mysql-pvc.yaml
  - mysql-deployment.yaml
  - php-deployment.yaml
  - ingress.yaml

configMapGenerator:
  - name: mysql-init
    files:
      - 01-gestion_produits.sql=../../docker/mysql/init/01-gestion_produits.sql

generatorOptions:
  disableNameSuffixHash: true
